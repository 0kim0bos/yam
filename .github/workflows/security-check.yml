name: Security check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      stage:
        type: string
        default: ci
      artifact_name:
        type: string
        default: yam-signed-release

permissions:
  contents: read

jobs:
  security:
    name: Security check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      # Repository variables are administrator-reviewed pins, never candidate values.
      - name: Verify reviewed executable closure before running project code
        env:
          REVIEW_PIN: ${{ vars.YAM_SECURITY_REVIEW_SHA256 }}
          POLICY_PIN: ${{ vars.YAM_SECURITY_POLICY_SHA256 }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = bytes => 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          const bytes = readFileSync('security/project-review.json');
          if (!process.env.REVIEW_PIN || hash(bytes) !== process.env.REVIEW_PIN) throw Error('review pin mismatch');
          if (!process.env.POLICY_PIN || hash(readFileSync('security/policy.json')) !== process.env.POLICY_PIN) throw Error('policy pin mismatch');
          const review = JSON.parse(bytes);
          if (review.schema !== 'yam.project-security-review.v1' || !Object.keys(review.files || {}).length) throw Error('invalid review');
          for (const [file, digest] of Object.entries(review.files)) {
            if (file.startsWith('/') || file.split('/').includes('..') || !lstatSync(file).isFile() || hash(readFileSync(file)) !== digest) throw Error('reviewed file mismatch');
          }
          NODE
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build reviewed validator
        run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.stage == 'deploy'
        with:
          name: ${{ inputs.artifact_name }}
          path: package-artifact
      - name: Run exact target security checks
        env:
          POLICY_PIN: ${{ vars.YAM_SECURITY_POLICY_SHA256 }}
          CHECK_STAGE: ${{ inputs.stage || 'ci' }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          SOURCE=$(git rev-parse HEAD)
          if [ "$CHECK_STAGE" = deploy ]; then
            ARTIFACT=$(node --input-type=module -e 'import{readdirSync}from"node:fs";const f=readdirSync("package-artifact").filter(x=>x.endsWith(".tgz"));if(f.length!==1)throw Error("one artifact required");process.stdout.write("package-artifact/"+f[0])')
            node scripts/project-security-check.mjs --stage deploy --source "$SOURCE" --artifact "$ARTIFACT" --configuration .github/workflows/release.yml --environment npm-production --environment-evidence .yam/security/deployment-inspection.json --policy-digest "$POLICY_PIN" --json
          else
            BASE=${CHECK_BASE:-$SOURCE}
            node scripts/project-security-check.mjs --stage ci --source "$SOURCE" --base "$BASE" --policy-digest "$POLICY_PIN" --json
          fi
      - name: Record bootstrap failures without executing candidate code
        if: failure()
        env:
          CHECK_STAGE: ${{ inputs.stage || 'ci' }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, existsSync, lstatSync, openSync, writeSync, closeSync, constants } from 'node:fs';
          for (const dir of ['.yam', '.yam/security']) {
            if (!existsSync(dir)) mkdirSync(dir, {mode: 0o700});
            if (!lstatSync(dir).isDirectory() || lstatSync(dir).isSymbolicLink()) throw Error('unsafe note directory');
          }
          const file = '.yam/security/notes.md';
          if (existsSync(file)) { const s = lstatSync(file); if (!s.isFile() || s.isSymbolicLink() || s.nlink !== 1) throw Error('unsafe note file'); }
          const areas = ["사용자·관리자·외부 서비스·DB·파일 사이의 신뢰 경계와 보호할 데이터·작업을 식별한다.", "명시적으로 허용한 접근만 열고, 사용자·서비스 계정에 필요한 최소 권한만 부여한다.", "화면을 우회한 API·서버 함수·DB·파일·백그라운드 작업에서도 사용자·조직·대상별 권한을 확인한다.", "계정 정지·승인 철회·탈퇴·소속 변경 후 기존 세션·토큰·캐시에서도 권한 회수가 반영된다.", "코드의 보안 정책·migration·ACL·환경 설정이 대상 배포 환경의 실제 상태와 일치한다.", "로그인·관리자 인증·세션 만료·로그아웃·비밀번호 재설정·계정 복구가 계정 탈취를 막도록 동작한다.", "외부 입력·파일 업로드·출력의 형식·크기·경로를 검증하고 SQL 주입·XSS·SSRF·CSRF 등 해당 공격을 방어한다.", "API 키·토큰·개인키·개인정보가 코드·브라우저 번들·로그·점검 기록에 불필요하게 노출되지 않는다.", "의존성·CI/CD 권한·배포 자격증명·릴리스 산출물의 출처와 무결성을 확인해 공급망 위험을 통제한다."];
          const fd = openSync(file, constants.O_WRONLY | constants.O_APPEND | constants.O_CREAT | constants.O_NOFOLLOW, 0o600);
          try { writeSync(fd, '\n-- Security check --\nRun: security-bootstrap-' + Date.now() + '\nTime: ' + new Date().toISOString() + '\nStage: ' + (process.env.CHECK_STAGE === 'deploy' ? 'deploy' : 'push') + '\nEnvironment: GitHub Actions\nBinding: unavailable; failed bootstrap diagnostic\nScope: failed CI initialization or check\nChecker: trusted workflow bootstrap\n\n' + areas.map((text,i) => `${i+1}. SEC-${String(i+1).padStart(2,'0')} : "${text}" : 미검증`).join('\n') + '\n\nRetry of: none\nResult: BLOCKED\nBlocking: CI bootstrap or check failed\nDeferred: none\n-- End Security check --\n'); }
          finally { closeSync(fd); }
          NODE
      - name: Preserve sanitized notes and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-check-${{ inputs.stage || 'ci' }}-${{ github.run_attempt }}
          path: |
            .yam/security/notes.md
            .yam/security/runs/
            .yam/security/project-evidence-*.json
          if-no-files-found: warn
          retention-days: 14
